<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>System Update</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#000; color:#00ff88;
    font-family: "Courier New", ui-monospace, monospace;
    user-select:none; -webkit-user-select:none; touch-action:none;
  }
  #stage { position:fixed; inset:0; }

  .layer { position:absolute; inset:0; display:none; }
  .layer.on { display:flex; }

  /* ================= WIPE ================= */
  #wipe { flex-direction:column; align-items:center; justify-content:center; background:#000; color:#fff; }
  #wipeText { font-size:14px; letter-spacing:0.4px; margin-bottom:80px; font-family:-apple-system,Roboto,Arial,sans-serif; }
  #barWrap { position:absolute; left:0; right:0; top:50%; height:4px; }
  #bar { height:100%; width:0%; background:#ff6900; transition:width 0.9s ease; box-shadow:0 0 14px rgba(255,105,0,0.7); }

  /* ================= BOOT ================= */
  #boot { flex-direction:column; align-items:center; justify-content:center; background:#000; color:#fff; }
  #logo { font-size:52px; font-weight:300; letter-spacing:8px; opacity:0; transition:opacity 0.8s ease; font-family:-apple-system,Roboto,Arial,sans-serif; }
  #logo.show { opacity:1; }
  #dots { margin-top:36px; font-size:28px; color:#ff6900; letter-spacing:4px; min-height:32px; }
  #warn { position:absolute; bottom:56px; left:20px; right:20px; text-align:center; font-size:11px; line-height:1.5; color:#9a9a9a; opacity:0; transition:opacity 1s ease 1.2s; font-family:-apple-system,Roboto,Arial,sans-serif; }
  #warn.show { opacity:1; }

  /* ================= HACK SEQUENCE ================= */
  #hack { flex-direction:column; background:#000; color:#00ff88; overflow:hidden; }
  #hackTop {
    padding:10px 14px;
    border-bottom:1px solid #00ff8840;
    display:flex; justify-content:space-between; align-items:center;
    font-size:11px; letter-spacing:1px;
  }
  #hackTop .blink { animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  #proc {
    padding:8px 14px;
    font-size:11px;
    display:flex; gap:14px;
    border-bottom:1px solid #00ff8820;
  }
  #proc span { opacity:0.85; }
  #proc b { color:#00ffcc; font-weight:400; }

  #canvasWrap { position:relative; flex:1; overflow:hidden; }
  #canvasWrap canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #netOverlay {
    position:absolute; top:12px; left:14px; right:14px;
    font-size:10px; line-height:1.6;
    color:#00ff88; text-shadow:0 0 6px #00ff88;
    pointer-events:none;
  }
  #netOverlay div { white-space:nowrap; overflow:hidden; }

  #term {
    height:34%;
    padding:8px 14px;
    font-size:11px;
    line-height:1.5;
    overflow:hidden;
    border-top:1px solid #00ff8840;
    background:linear-gradient(180deg, #000814 0%, #000 100%);
    color:#00ff88;
    text-shadow:0 0 4px #00ff88aa;
  }
  #term div { white-space:pre; }

  /* ================= FINAL ================= */
  #final {
    flex-direction:column; align-items:center; justify-content:center;
    background:#000; color:#ff2b2b;
    font-family:-apple-system,Roboto,Arial,sans-serif;
    text-align:center; padding:20px;
  }
  #final h1 { font-size:22px; letter-spacing:2px; margin-bottom:14px; font-weight:500; }
  #final p { font-size:12px; color:#888; line-height:1.7; }
  #final .skull { font-size:64px; margin-bottom:24px; opacity:0.9; filter:drop-shadow(0 0 12px #ff2b2b); }
</style>
</head>
<body>

<div id="stage">

  <!-- WIPE -->
  <div id="wipe" class="layer on">
    <div id="wipeText">Wiping data...</div>
    <div id="barWrap"><div id="bar"></div></div>
  </div>

  <!-- BOOT -->
  <div id="boot" class="layer">
    <div id="logo">MIUI</div>
    <div id="dots"></div>
    <div id="warn">The bootloader is unlocked and software integrity<br>cannot be guaranteed. Any data stored on the device<br>may be accessible.</div>
  </div>

  <!-- HACK -->
  <div id="hack" class="layer">
    <div id="hackTop">
      <span>● ROOT@DEVICE</span>
      <span id="clock">--:--:--</span>
      <span class="blink">●REC</span>
    </div>
    <div id="proc">
      <span>CPU <b id="cpu">0</b>%</span>
      <span>MEM <b id="mem">0</b>%</span>
      <span>NET <b id="net">0</b>kb/s</span>
    </div>
    <div id="canvasWrap">
      <canvas id="c1"></canvas>
      <div id="netOverlay"></div>
    </div>
    <div id="term"></div>
  </div>

  <!-- FINAL -->
  <div id="final" class="layer">
    <div class="skull">☠</div>
    <h1>DEVICE OWNED</h1>
    <p>All data exfiltrated.<br>Network captured.<br>Encryption keys dumped.</p>
  </div>

</div>

<script>
(function () {
  /* ---------- fullscreen + wake lock ---------- */
  function fs() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen({ navigationUI:"hide" }).catch(()=>{});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }
  document.addEventListener("click", fs, { once:true });
  document.addEventListener("touchstart", fs, { once:true });
  if ("wakeLock" in navigator) navigator.wakeLock.request("screen").catch(()=>{});

  /* ---------- block back / esc ---------- */
  history.pushState(null, "", location.href);
  window.addEventListener("popstate", () => history.pushState(null,"",location.href));
  document.addEventListener("keydown", e => {
    if (["Escape","BrowserBack","Backspace"].includes(e.key)) { e.preventDefault(); e.stopPropagation(); }
  });

  /* ---------- element refs ---------- */
  const $ = id => document.getElementById(id);
  const wipeEl = $("wipe"), bootEl = $("boot"), hackEl = $("hack"), finalEl = $("final");
  const wipeText = $("wipeText"), bar = $("bar");
  const logoEl = $("logo"), dotsEl = $("dots"), warnEl = $("warn");
  const cpuEl = $("cpu"), memEl = $("mem"), netEl = $("net"), clockEl = $("clock");
  const termEl = $("term"), netOverlay = $("netOverlay");
  const canvas = $("c1");
  const ctx = canvas.getContext("2d");

  /* ---------- WIPE SEQUENCE ---------- */
  const steps = [
    "Wiping data...",
    "Formatting /data...",
    "Formatting /cache...",
    "Wiping Dalvik cache...",
    "Erasing userdata...",
    "Removing encryption keys...",
    "Wipe complete. Rebooting..."
  ];
  let i = 0;
  function tick() {
    if (i >= steps.length) return startBoot();
    wipeText.textContent = steps[i];
    bar.style.width = Math.round(((i+1)/steps.length)*100) + "%";
    if (navigator.vibrate) navigator.vibrate(60);
    i++;
    setTimeout(tick, 900 + Math.random()*400);
  }
  setTimeout(tick, 500);

  /* ---------- BOOT ---------- */
  function startBoot() {
    wipeEl.classList.remove("on");
    bootEl.classList.add("on");
    requestAnimationFrame(() => { logoEl.classList.add("show"); warnEl.classList.add("show"); });
    let d = 0;
    const dt = setInterval(() => { d = (d+1)%4; dotsEl.textContent = ".".repeat(d) + " "; }, 420);
    setTimeout(() => {
      clearInterval(dt);
      bootEl.classList.remove("on");
      startHack();
    }, 4500);
  }

  /* ---------- HACK SEQUENCE ---------- */
  let running = false;
  function startHack() {
    hackEl.classList.add("on");
    sizeCanvas();
    window.addEventListener("resize", sizeCanvas);
    running = true;
    requestAnimationFrame(loop);
    startStats();
    startTerminal();
    startNetOverlay();
    setTimeout(() => {
      running = false;
      hackEl.classList.remove("on");
      finalEl.classList.add("on");
      if (navigator.vibrate) navigator.vibrate([200,80,200,80,400]);
    }, 16000);
  }

  /* ---------- canvas sizing ---------- */
  function sizeCanvas() {
    const r = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = r.width * dpr;
    canvas.height = r.height * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    buildNodes();
  }

  /* ---------- network nodes ---------- */
  let nodes = [];
  function buildNodes() {
    const w = canvas.width / (window.devicePixelRatio||1);
    const h = canvas.height / (window.devicePixelRatio||1);
    nodes = [];
    // center device
    nodes.push({ x:w/2, y:h/2, r:8, type:"self", name:"THIS DEVICE" });
    // surrounding networks
    const count = 7;
    for (let k=0; k<count; k++) {
      const a = (Math.PI*2/count)*k + Math.random()*0.4;
      const d = Math.min(w,h)*0.32 + Math.random()*40;
      nodes.push({
        x: w/2 + Math.cos(a)*d,
        y: h/2 + Math.sin(a)*d,
        r: 5,
        type: "ap",
        name: ["HOME_5G","TP-LINK_2.4","AIRTEL_WIFI","Neighbor_AP","Hidden_SSID","JIO_FIBER","Mi-Router"][k%7],
        hacked: false,
        hackTime: 1500 + k*1800,
        phase: Math.random()*Math.PI*2
      });
    }
  }

  /* ---------- packet particles ---------- */
  const packets = [];
  function spawnPacket(from, to) {
    packets.push({
      x: from.x, y: from.y,
      tx: to.x, ty: to.y,
      t: 0,
      speed: 0.012 + Math.random()*0.02,
      color: to.type === "self" ? "#00ff88" : "#ff6900"
    });
  }

  /* ---------- main loop ---------- */
  let selfPulse = 0;
  function loop(ts) {
    if (!running) return;
    const w = canvas.width / (window.devicePixelRatio||1);
    const h = canvas.height / (window.devicePixelRatio||1);
    ctx.clearRect(0,0,w,h);

    // grid background
    ctx.strokeStyle = "#00ff8812";
    ctx.lineWidth = 1;
    const gs = 28;
    for (let x=0; x<w; x+=gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
    for (let y=0; y<h; y+=gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }

    const self = nodes[0];
    selfPulse += 0.06;
    const pulse = 1 + Math.sin(selfPulse)*0.25;

    // connections
    nodes.forEach(n => {
      if (n.type !== "ap") return;
      const dx = n.x-self.x, dy = n.y-self.y;
      const dist = Math.hypot(dx,dy);

      // base line
      ctx.beginPath();
      ctx.moveTo(self.x, self.y);
      ctx.lineTo(n.x, n.y);
      ctx.strokeStyle = n.hacked ? "#00ff88" : "#ff690033";
      ctx.lineWidth = n.hacked ? 1.5 : 0.7;
      ctx.stroke();

      // animated signal wave along line
      const t = (performance.now()/1000 + n.phase) % 1;
      const wx = self.x + dx*t;
      const wy = self.y + dy*t;
      ctx.beginPath();
      ctx.arc(wx, wy, 2.5, 0, Math.PI*2);
      ctx.fillStyle = n.hacked ? "#00ff88" : "#ff6900";
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;
    });

    // nodes
    nodes.forEach(n => {
      const isSelf = n.type === "self";
      const r = isSelf ? n.r*pulse : n.r;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI*2);
      ctx.fillStyle = isSelf ? "#00ff88" : (n.hacked ? "#00ff88" : "#ff6900");
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = isSelf ? 22 : 14;
      ctx.fill();
      ctx.shadowBlur = 0;

      // outer ring
      ctx.beginPath();
      ctx.arc(n.x, n.y, r+6, 0, Math.PI*2);
      ctx.strokeStyle = isSelf ? "#00ff8866" : (n.hacked ? "#00ff8866" : "#ff690044");
      ctx.lineWidth = 1;
      ctx.stroke();

      // label
      ctx.font = "9px Courier New";
      ctx.fillStyle = isSelf ? "#00ff88" : (n.hacked ? "#00ff88" : "#ff6900");
      ctx.textAlign = "center";
      ctx.fillText(n.name, n.x, n.y + r + 14);
    });

    // packets
    for (let k=packets.length-1; k>=0; k--) {
      const p = packets[k];
      p.t += p.speed;
      if (p.t >= 1) { packets.splice(k,1); continue; }
      const x = p.x + (p.tx-p.x)*p.t;
      const y = p.y + (p.ty-p.y)*p.t;
      ctx.beginPath();
      ctx.arc(x, y, 1.8, 0, Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // random packet spawns
    if (Math.random() < 0.35) {
      const target = nodes[1 + Math.floor(Math.random()*(nodes.length-1))];
      if (target && Math.random() < 0.5) spawnPacket(target, self);
      else if (target) spawnPacket(self, target);
    }

    requestAnimationFrame(loop);
  }

  /* ---------- live stats ---------- */
  function startStats() {
    let cpu = 45, mem = 62, net = 120;
    setInterval(() => {
      cpu = Math.max(30, Math.min(99, cpu + (Math.random()-0.4)*20));
      mem = Math.max(50, Math.min(94, mem + (Math.random()-0.4)*10));
      net = Math.max(40, Math.min(980, net + (Math.random()-0.4)*140));
      cpuEl.textContent = Math.round(cpu);
      memEl.textContent = Math.round(mem);
      netEl.textContent = Math.round(net);
      const now = new Date();
      clockEl.textContent = now.toTimeString().slice(0,8);
    }, 240);
  }

  /* ---------- terminal stream ---------- */
  const lines = [
    "[*] root@device:~# ./netmap --live",
    "[*] scanning subnets 192.168.0.0/24 ...",
    "[+] found AP: HOME_5G  (WPA2)  ch:36  rssi:-42",
    "[+] found AP: TP-LINK_2.4  (WPA2)  ch:6   rssi:-58",
    "[+] found AP: JIO_FIBER  (WPA3)  ch:11  rssi:-71",
    "[*] initiating handshake capture ...",
    "[*] deauth burst -> client 4c:1a:9d:xx:xx:xx",
    "[+] EAPOL 4-way handshake captured (PMKID)",
    "[*] cracking PSK via wordlist+GPU ...",
    "[+] PSK recovered: **********",
    "[*] joining network HOME_5G ...",
    "[+] DHCP lease: 192.168.0.117 / 24",
    "[*] ARP spoofing gateway 192.168.0.1 ...",
    "[+] MITM tunnel established (arp:active)",
    "[*] dumping LAN hosts ...",
    "[+] 14 hosts online — inspecting traffic",
    "[*] injecting payload into DNS responses",
    "[+] session token captured: uid=admin",
    "[*] pivoting to router admin panel ...",
    "[+] default creds accepted (admin:admin)",
    "[*] modifying firewall rules ...",
    "[+] opening reverse tunnel :4444 -> c2.node",
    "[*] exfiltrating /sdcard/DCIM ...",
    "[*] exfiltrating /sdcard/WhatsApp ...",
    "[*] exfiltrating /data/system/accounts.db",
    "[+] 2.4 GB transferred @ 18.4 MB/s",
    "[*] dropping persistence payload",
    "[+] system service hijacked (init.d)",
    "[*] wiping local traces ...",
    "[+] rm -rf /data/local/tmp/*",
    "[!] DEVICE FULLY OWNED — closing shell"
  ];
  function startTerminal() {
    let idx = 0;
    function push() {
      if (idx >= lines.length) return;
      const d = document.createElement("div");
      d.textContent = lines[idx];
      termEl.appendChild(d);
      // keep last N lines
      while (termEl.childElementCount > 14) termEl.removeChild(termEl.firstChild);
      if (navigator.vibrate) navigator.vibrate(20);
      idx++;
      setTimeout(push, 400 + Math.random()*500);
    }
    push();
  }

  /* ---------- network overlay text ---------- */
  const overlayLines = [
    "iface: wlan0 · MAC 4c:1a:9d:xx:xx:xx",
    "ssid : HOME_5G · bssid 9c:1c:12:aa:bb:cc",
    "mode : monitor + injection",
    "handshake : EAPOL/PMKID ✓",
    "gateway : 192.168.0.1 (MITM)",
    "c2 : 185.xxx.xxx.xxx:4444 (TLS)"
  ];
  function startNetOverlay() {
    let i = 0;
    function next() {
      if (i >= overlayLines.length) return;
      const d = document.createElement("div");
      d.textContent = overlayLines[i];
      netOverlay.appendChild(d);
      i++;
      setTimeout(next, 1400);
    }
    next();
  }
})();
</script>
</body>
</html>
